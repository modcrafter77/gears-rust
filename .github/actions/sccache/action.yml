name: Gears sccache
description: >-
  Restore a per-job local sccache directory from the Actions cache, then start
  sccache on local disk; fall back to rustc on startup failure. The directory is
  saved once at the end of the job by the sccache-stats action, and only on a
  push to main (or a benchmark dispatch). Pull requests read the main cache and
  never write, so they cannot evict it from the repository's 10 GB quota. One
  archive per job also keeps clear of the cache service's upload rate limit,
  which per-object remote sccache writes exceed (HTTP 429).
outputs:
  enabled:
    description: Whether the server started and RUSTC_WRAPPER was enabled
    value: ${{ steps.probe.outputs.enabled }}
runs:
  using: composite
  steps:
    - name: Read sccache version
      id: versions
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/../../../tools/ci/tool_versions.py"
    - name: Install pinned sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v${{ steps.versions.outputs.sccache }}
    - name: Compute sccache archive key
      id: key
      shell: bash
      env:
        NAMESPACE: ${{ env.CF_CACHE_NAMESPACE || 'v1' }}
        TOOLCHAIN: ${{ hashFiles('rust-toolchain.toml') }}
        SAVE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && env.CF_CACHE_NAMESPACE != '') }}
      run: |
        prefix="sccache-${NAMESPACE}-${GITHUB_JOB}-${RUNNER_OS}-${RUNNER_ARCH}-${TOOLCHAIN:0:12}-"
        {
          echo "SCCACHE_DIR=${RUNNER_TEMP}/sccache-dir"
          echo "SCCACHE_ARCHIVE_KEY=${prefix}${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          echo "SCCACHE_ARCHIVE_SAVE=${SAVE}"
        } >> "$GITHUB_ENV"
        echo "prefix=${prefix}" >> "$GITHUB_OUTPUT"
        echo "dir=${RUNNER_TEMP}/sccache-dir" >> "$GITHUB_OUTPUT"
    - name: Restore sccache archive
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.key.outputs.dir }}
        key: ${{ env.SCCACHE_ARCHIVE_KEY }}
        restore-keys: ${{ steps.key.outputs.prefix }}
    - name: Start local sccache
      id: probe
      shell: bash
      run: |
        mkdir -p "$SCCACHE_DIR"
        du -sh "$SCCACHE_DIR" || true
        if sccache --start-server; then
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          sccache --show-stats
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::warning::sccache failed to start; compiling with plain rustc"
        fi
